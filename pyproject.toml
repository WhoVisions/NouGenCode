[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nougencode"
version = "0.1.0"
description = "NouGen fleet AST code cleaner, dead code scanner, and bloat sweeper."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
]

[project.scripts]
nougencode = "nougencode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nougencode = ["schemas/*.json"]
